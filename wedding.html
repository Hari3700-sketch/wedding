<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Saurabh Singh Weds Deepja Singh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Wedding invitation of Saurabh Singh and Deepja Singh, 3 December 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one 430px phone column. A maroon book opens onto a blush page of florals, a pull-to-reveal scroll, a coverflow of functions and a map. */
:root{
  --outer:#ead2d8;
  --blush:#fbeef0;
  --blush-2:#f6dde2;
  --maroon:#7a1f3d;
  --maroon-2:#5a1230;
  --gold:#c9a45c;
  --gold-hi:#ecd9a2;
  --gold-lo:#9a7634;
  --ink:#4a1a2b;
  --muted:#8a6470;
  --soft:#fffaf7;
  --serif:'Cormorant Garamond','Playfair Display',Georgia,serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--outer)}
html.locked,html.locked body{overflow:hidden;height:100%}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--sans);overflow-x:hidden;overflow-x:clip}
.phone{position:relative;max-width:430px;margin:0 auto;background:var(--blush);overflow:hidden;box-shadow:0 0 70px rgba(90,18,48,.18)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sec{position:relative;padding-block:60px;text-align:center}
.eyebrow{font:500 10.5px/1.4 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--gold-lo);margin:0}
.h2{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.1;color:var(--maroon);margin:10px 0 0;text-wrap:balance}
.gold-text{background:linear-gradient(135deg,#f3e2aa,#c9a45c 50%,#9a7634);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
svg{display:block}

/* reveal */
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}
.js .rv-tilt{transform:perspective(900px) rotateX(24deg) translateY(30px);transform-origin:50% 100%}
.js .rv-tilt.in{transform:none}

/* petals canvas */
#petals{position:fixed;top:0;bottom:0;left:50%;width:min(100%,430px);height:100%;transform:translateX(-50%);z-index:60;pointer-events:none}

/* florals + bells */
.florals{position:absolute;top:0;width:190px;height:190px;pointer-events:none;z-index:1}
.florals.tl{left:0}
.florals.tr{right:0;transform:scaleX(-1)}
.bells{position:absolute;top:0;left:0;right:0;height:120px;pointer-events:none;z-index:3}
.bell{position:absolute;top:0;transform-origin:50% 0;animation:swing 4.2s ease-in-out infinite alternate}
.bell svg{width:100%;height:auto}
@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}

/* intro / book */
.intro{position:fixed;top:0;bottom:0;left:50%;width:min(100%,430px);transform:translateX(-50%);z-index:40;background:var(--blush);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);overflow:hidden;transition:opacity .9s ease}
.intro.fade{opacity:0;pointer-events:none}
.stage{perspective:1400px;position:relative;z-index:2}
.book{position:relative;width:min(74vw,300px,calc((100svh - 200px) / 1.4));aspect-ratio:3/4.2;transform-style:preserve-3d;cursor:pointer;transition:transform 1.5s cubic-bezier(.55,.05,.25,1);outline:none}
.book.open{transform:translateX(14%)}
.book:focus-visible{outline:2px solid var(--gold);outline-offset:8px}
.pages{position:absolute;inset:0;border-radius:3px 10px 10px 3px;background:linear-gradient(90deg,#ead7bf,#fff7ec 14%);box-shadow:5px 0 0 #f1e2cd,7px 0 0 #d9c6aa,10px 16px 30px rgba(90,18,48,.38);display:grid;place-items:center}
.pages .inner{width:78%;height:82%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold-lo);font:italic 500 16px var(--serif);letter-spacing:.08em}
.cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.55,.05,.25,1)}
.book.open .cover{transform:rotateY(-158deg)}
.face{position:absolute;inset:0;border-radius:3px 10px 10px 3px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:linear-gradient(135deg,#8c2352 0%,#7a1f3d 45%,#5a1230 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 8px 0 14px rgba(0,0,0,.28),6px 12px 26px rgba(90,18,48,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--gold-hi)}
.front::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.12),transparent 38%,transparent 70%,rgba(255,255,255,.05));pointer-events:none}
.front .b1{position:absolute;inset:9px;border:1px solid var(--gold);border-radius:2px 7px 7px 2px}
.front .b2{position:absolute;inset:14px;border:1px solid rgba(201,164,92,.7);border-radius:1px 5px 5px 1px}
.orn{position:absolute;width:34px;height:34px;color:var(--gold-hi)}
.orn.a{top:9px;left:9px}.orn.b{top:9px;right:9px;transform:scaleX(-1)}.orn.c{bottom:9px;left:9px;transform:scaleY(-1)}.orn.d{bottom:9px;right:9px;transform:scale(-1,-1)}
.motif{width:30%;min-width:76px;aspect-ratio:1;color:var(--gold-hi)}
.motif svg{width:100%;height:100%}
.cv-title{font:600 clamp(15px,4.6vw,19px)/1 var(--serif);letter-spacing:.3em;text-indent:.3em;margin:6px 0 0;text-transform:uppercase}
.cv-sub{font:italic 500 clamp(13px,3.8vw,16px)/1 var(--serif);color:#f3e6cf;margin:0;letter-spacing:.06em}
.back{transform:rotateY(180deg);background:linear-gradient(225deg,#f7e0e4,#efc9d1);box-shadow:inset 0 0 0 10px #f7e0e4,inset 0 0 0 11px var(--gold)}
.tapwrap{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:2;transition:opacity .5s}
.tapwrap.gone{opacity:0}
.tap{width:54px;height:54px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;position:relative}
.tap::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--gold);animation:ring 2.2s ease-out infinite}
.tap i{width:16px;height:16px;border-radius:50%;background:var(--gold);animation:dot 2.2s ease-in-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.8);opacity:0}}
@keyframes dot{0%,100%{transform:scale(1)}50%{transform:scale(.7)}}

/* names */
.names{min-height:min(100svh,780px);padding-top:0;padding-bottom:84px}
.arch{position:absolute;top:70px;bottom:64px;left:28px;right:28px;border:1px solid var(--gold);border-radius:999px 999px 0 0;overflow:hidden;z-index:0;background:var(--blush)}
.arch-bg{position:absolute;inset:-12%;background:radial-gradient(circle at 28% 24%,#f7c6d1 0,transparent 52%),radial-gradient(circle at 76% 58%,#f2dcae 0,transparent 48%),radial-gradient(circle at 46% 98%,#eba2b6 0,transparent 58%),radial-gradient(circle at 80% 8%,#fbd9e0 0,transparent 40%);filter:blur(22px);animation:kb 22s ease-in-out infinite alternate;will-change:transform}
.arch::after{content:"";position:absolute;inset:0;background:rgba(255,250,247,.42)}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.18) translate(-3%,-2%)}}
.names-in{position:relative;z-index:2;padding-top:140px;display:flex;flex-direction:column;align-items:center}
.m-s{width:46px;height:46px;color:var(--gold-lo)}
.m-s svg{width:100%;height:100%}
.together{margin:16px 0 22px;font:500 9.5px/1.5 var(--sans);letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:var(--gold-lo)}
.nm{font:500 clamp(40px,12.4vw,52px)/1 var(--serif);color:var(--maroon);margin:0;text-wrap:balance}
.par{font:400 11.5px/1.5 var(--sans);letter-spacing:.06em;color:var(--muted);margin:10px 0 0;max-width:250px;text-wrap:balance}
.amp{font:italic 400 44px/1 var(--serif);color:var(--gold);margin:14px 0 12px}
.req{font:italic 400 19px/1.35 var(--serif);color:var(--ink);margin:26px 0 0;max-width:240px;text-wrap:balance}
.hint{position:absolute;left:0;right:0;bottom:12px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;font:500 9.5px var(--sans);letter-spacing:.34em;text-indent:.34em;color:var(--gold-lo)}
.hint svg{width:18px;height:18px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* save the date */
.scroll{--p:0;position:relative;width:272px;margin:34px auto 0;height:calc(138px + var(--p) * 290px)}
.rod{position:absolute;left:0;right:0;height:16px;border-radius:8px;background:linear-gradient(180deg,#f6e7b4,#c9a45c 45%,#8f6c2c);box-shadow:0 3px 6px rgba(90,18,48,.25)}
.rod::before,.rod::after{content:"";position:absolute;top:-3px;width:10px;height:22px;border-radius:5px;background:linear-gradient(180deg,#f7e8b8,#b8913f)}
.rod::before{left:-6px}.rod::after{right:-6px}
.rod.top{top:0;z-index:2}
.roll{position:absolute;left:14px;right:14px;top:12px;height:34px;border-radius:17px;background:linear-gradient(180deg,#fff6e6,#f1dcb8 55%,#d9bd8c);box-shadow:inset 0 -6px 8px rgba(120,80,30,.15);z-index:1}
.paper{position:absolute;left:16px;right:16px;top:46px;height:290px;background:linear-gradient(180deg,#fff9ee,#fbefd9);border-left:1px solid rgba(201,164,92,.5);border-right:1px solid rgba(201,164,92,.5);clip-path:inset(0 0 calc((1 - var(--p)) * 100%) 0);padding-top:30px;display:flex;flex-direction:column;align-items:center}
.pd-day{font:600 14px var(--sans);letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:var(--gold-lo)}
.pd-num{font:600 124px/.95 var(--serif);color:var(--maroon);margin-top:8px}
.pd-mon{font:italic 500 36px/1.1 var(--serif);color:var(--maroon);margin-top:4px}
.pd-yr{font:500 15px var(--sans);letter-spacing:.4em;text-indent:.4em;color:var(--gold-lo);margin-top:12px}
.handle{position:absolute;left:0;right:0;top:46px;height:92px;transform:translateY(calc(var(--p) * 290px));touch-action:none;cursor:grab;z-index:3;outline:none}
.handle:active{cursor:grabbing}
.handle:focus-visible .rod{outline:2px solid var(--maroon);outline-offset:3px}
.handle .rod{top:0}
.tassel{position:absolute;left:50%;top:14px;width:40px;margin-left:-20px;height:74px}
.pullhint{position:absolute;left:calc(50% + 28px);top:34px;width:22px;height:22px;color:var(--maroon);opacity:calc(1 - var(--p) * 8)}
.pullhint svg{width:100%;height:100%;animation:bob 1.4s ease-in-out infinite}
.seeyou{font:italic 500 22px/1.3 var(--serif);color:var(--ink);margin:26px 0 0;text-wrap:balance}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px;margin:26px auto 0}
.cu{padding:14px 0 10px;border:1px solid rgba(201,164,92,.7);border-radius:14px;background:rgba(255,250,247,.7)}
.cu b{display:block;font:600 32px/1 var(--serif);color:var(--maroon);font-variant-numeric:tabular-nums}
.cu small{display:block;margin-top:6px;font:500 9px var(--sans);letter-spacing:.24em;text-indent:.24em;color:var(--gold-lo)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;font:500 11px/1 var(--sans);letter-spacing:.2em;text-indent:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:1px solid var(--maroon);color:var(--maroon);background:transparent;transition:transform .2s}
.btn:active{transform:scale(.97)}
.btn.fill{background:var(--maroon);color:#fff}
.btn.gold{border-color:var(--gold-lo);color:var(--gold-lo)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* festivities */
.fwrap{margin-top:8px}
.ftrack{position:relative;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:30px 0 36px;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;text-align:center}
.ftrack::-webkit-scrollbar{display:none}
.ftrack::before,.ftrack::after{content:"";flex:0 0 calc(50% - 148px)}
.fcard{flex:0 0 264px;scroll-snap-align:center;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 14px 30px rgba(90,18,48,.18);transform:scale(.84);opacity:.55;display:flex;flex-direction:column;will-change:transform,opacity}
.ftop{position:relative;height:176px;background:linear-gradient(160deg,var(--c1),var(--c2));display:grid;place-items:center}
.lights{position:absolute;top:0;left:0;width:100%;height:auto}
.bulb{animation:twinkle 2.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}
.ficon{width:150px;height:auto;margin-top:26px}
.fbot{flex:1;padding:18px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:6px}
.fday{font:500 10.5px/1.4 var(--sans);letter-spacing:.2em;text-indent:.2em;text-transform:uppercase;color:var(--muted)}
.ftime{font:500 13px var(--sans);letter-spacing:.1em;color:var(--maroon)}
.fnote{font:italic 400 15px var(--serif);color:var(--gold-lo)}
.fname{font:600 30px/1.05 var(--serif);color:var(--maroon);margin:2px 0 0;text-wrap:balance}
.fplace{font:400 12px/1.4 var(--sans);color:var(--muted)}
.chip{margin-top:auto;display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border:1px solid #ecd9dd;border-radius:999px;text-align:left}
.chip .sw{flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:var(--sw);box-shadow:0 0 0 1px rgba(0,0,0,.14)}
.chip small{display:block;font:500 8.5px var(--sans);letter-spacing:.24em;color:var(--gold-lo)}
.chip b{display:block;font:italic 500 15px/1.15 var(--serif);color:var(--ink)}
.dots{display:flex;justify-content:center;gap:8px;margin-top:-6px}
.dots button{width:7px;height:7px;padding:0;border:0;border-radius:4px;background:#e2c3ca;cursor:pointer;transition:width .3s,background .3s}
.dots button.on{width:22px;background:var(--maroon)}
.swipe{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px;font:500 9.5px var(--sans);letter-spacing:.3em;color:var(--gold-lo)}
.swipe svg{width:16px;height:16px}

/* reception */
.rcard{position:relative;max-width:340px;margin:0 auto;padding:44px 24px 40px;border-radius:18px;background:linear-gradient(160deg,#8a2250,#5a1230);color:var(--gold-hi);box-shadow:0 20px 40px rgba(90,18,48,.35);border:1.5px solid var(--gold)}
.rcard::before{content:"";position:absolute;inset:7px;border:1px solid rgba(201,164,92,.6);border-radius:12px;pointer-events:none}
.rcard .k{font:500 10px var(--sans);letter-spacing:.32em;text-indent:.32em}
.rcard h2{font:500 46px/1 var(--serif);color:#fff3d6;margin:14px 0 6px;text-wrap:balance}
.rcard .ic{width:104px;margin:6px auto 12px}
.rcard .l1{font:600 20px var(--serif);letter-spacing:.04em;color:#fff3d6;margin:4px 0 0}
.rcard .l2{font:italic 500 18px var(--serif);margin:6px 0 0;color:var(--gold-hi)}
.rcard .l3{font:400 12px var(--sans);letter-spacing:.08em;color:#f0d9de;margin:10px 0 0}
.rcard .chip{margin-top:20px;border-color:rgba(201,164,92,.7);background:rgba(255,255,255,.06)}
.rcard .chip small{color:var(--gold-hi)}
.rcard .chip b{color:#fff3d6}

/* reach */
.mapcard{display:block;margin:28px auto 0;max-width:360px;border-radius:22px;overflow:hidden;box-shadow:0 14px 30px rgba(90,18,48,.16);border:1px solid rgba(201,164,92,.5);background:#efe3cf}
.mapcard svg{width:100%;height:auto}
.mapcard text{font-family:var(--sans)}
.route{stroke-dasharray:1;stroke-dashoffset:1}
.in .route,.route.go{animation:draw 3.2s ease-out .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pin{opacity:0;transform-origin:252px 98px}
.in .pin,.pin.go{animation:drop .6s cubic-bezier(.3,1.5,.5,1) 3.3s forwards}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.venue{font:600 32px/1.1 var(--serif);color:var(--maroon);margin:26px 0 0}
.addr{font:400 12.5px/1.6 var(--sans);letter-spacing:.04em;color:var(--muted);margin:8px auto 0;max-width:260px;user-select:all;-webkit-user-select:all}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}

/* rsvp */
.respond{font:italic 400 21px/1.35 var(--serif);color:var(--ink);margin:14px auto 0;max-width:270px;text-wrap:balance}
.close{font:italic 500 22px/1.3 var(--serif);color:var(--maroon);margin:52px 0 0}
.mono{position:relative;width:112px;height:112px;border-radius:50%;border:1.5px solid var(--gold);margin:22px auto 0;display:grid;place-items:center}
.mono::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(201,164,92,.6)}
.mono span{font:600 42px/1 var(--serif);display:flex;align-items:baseline;gap:2px}
.mono em{font:italic 400 26px var(--serif)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--maroon-2);color:#fff;font:500 12px var(--sans);letter-spacing:.14em;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .arch-bg{animation:none!important}
  .route{stroke-dashoffset:0}
  .pin{opacity:1}
}
</style>

<script>

var reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
var root=document.documentElement;
root.classList.add('js','locked');
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function get(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k]},o)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}

document.title=CONFIG.title;
$$('[data-t]').forEach(function(el){var v=get(CONFIG,el.getAttribute('data-t'));if(v!=null)el.textContent=v;});

$('#mi2').textContent=CONFIG.bride.initial;

/* ---------- Petals ---------- */
var cv=$('#petals'),cx=cv.getContext('2d'),W=0,H=0;
var COL=['#f2a7b8','#e98aa3','#f7c6d0','#d96a8a','#f4b6c4'];
var drift=[],fx=[];
function size(){var d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0)}
function mk(o){var p={x:0,y:0,vx:0,vy:0,r:Math.random()*6.28,vr:(Math.random()-.5)*2.4,s:6+Math.random()*7,c:COL[(Math.random()*COL.length)|0],sw:Math.random()*6.28,swa:0,life:Infinity,age:0,g:0,drag:1};for(var k in o)p[k]=o[k];return p}
function resetDrift(p,top){p.x=Math.random()*W;p.y=top?-20:Math.random()*H;p.vy=22+Math.random()*30;p.swa=.25+Math.random()*.4;p.s=6+Math.random()*6}
function burst(x,y,n){if(reduce)return;for(var i=0;i<n;i++){var a=Math.random()*6.283,sp=120+Math.random()*280;fx.push(mk({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-140,g:380,life:2.4+Math.random()*1.2,drag:.985,swa:.3}))}}
function shower(n){if(reduce)return;for(var i=0;i<n;i++){fx.push(mk({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*30,vy:70+Math.random()*100,life:7,swa:.7}))}}
function drawPetal(p,a){cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,.65+.35*Math.abs(Math.sin(p.age*1.6+p.sw)));cx.globalAlpha=a;cx.fillStyle=p.c;var s=p.s;cx.beginPath();cx.moveTo(0,-s);cx.bezierCurveTo(s*.9,-s*.5,s*.7,s*.7,0,s);cx.bezierCurveTo(-s*.7,s*.7,-s*.9,-s*.5,0,-s);cx.fill();cx.restore()}
var last=0,running=false;
function frame(t){
  if(!running)return;
  var dt=Math.min((t-last)/1000,.05);last=t;
  cx.clearRect(0,0,W,H);
  drift.forEach(function(p){p.age+=dt;p.y+=p.vy*dt;p.x+=Math.sin(p.age*.9+p.sw)*p.swa;p.r+=p.vr*dt;if(p.y>H+20)resetDrift(p,true);drawPetal(p,.7)});
  for(var i=fx.length-1;i>=0;i--){
    var p=fx[i];p.age+=dt;
    var k=Math.pow(p.drag,dt*60);p.vx*=k;p.vy=p.vy*k+p.g*dt;
    p.x+=p.vx*dt+Math.sin(p.age*2+p.sw)*p.swa;p.y+=p.vy*dt;p.r+=p.vr*dt;
    if(p.age>p.life||p.y>H+30){fx.splice(i,1);continue}
    drawPetal(p,Math.max(0,Math.min(.85,(p.life-p.age)/.8)));
  }
  requestAnimationFrame(frame)
}
function startPetals(){
  if(reduce){cv.hidden=true;return}
  size();
  var n=W<360?9:12;
  for(var i=0;i<n;i++){var p=mk({});resetDrift(p,false);drift.push(p)}

}
window.addEventListener('resize',function(){if(!reduce)size()});
document.addEventListener('visibilitychange',function(){if(reduce)return;if(document.hidden){running=false}else if(!running){running=true;requestAnimationFrame(function(t){last=t;frame(t)})}});
startPetals();

/* ---------- Reveal ---------- */
var io=null,revealStarted=false;
function startReveal(){
  if(revealStarted)return;revealStarted=true;
  if('IntersectionObserver' in window){
    io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
    $$('.rv').forEach(function(el){io.observe(el)});
  }else{$$('.rv').forEach(function(el){el.classList.add('in')})}
}

/* ---------- Book ---------- */
var book=$('#book'),intro=$('#intro'),opened=false;
function openBook(){
  if(opened)return;opened=true;
  book.classList.add('open');
  $('#tapwrap').classList.add('gone');
  setTimeout(function(){
    var r=book.getBoundingClientRect(),c=cv.getBoundingClientRect();
    burst(r.left+r.width*.5-c.left,r.top+r.height*.5-c.top,52);
  },500);
  setTimeout(function(){
    intro.classList.add('fade');
    root.classList.remove('locked');
    window.scrollTo(0,0);
    startReveal();
  },reduce?100:1500);
  setTimeout(function(){intro.hidden=true},reduce?400:2500);
}
book.addEventListener('click',openBook);
book.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openBook()}});

/* ---------- Pull to reveal ---------- */
var sc=$('#scroll'),handle=$('#handle'),SH=290,P=0,raf=0,drag=null;
function setP(v){P=v;sc.style.setProperty('--p',v.toFixed(4))}
function animateTo(to){
  cancelAnimationFrame(raf);
  if(to===1&&P<1)shower(36);
  if(reduce){setP(to);return}
  var from=P,t0=performance.now(),dur=250+650*Math.abs(to-from);
  (function step(t){var k=Math.min((t-t0)/dur,1),e=1-Math.pow(1-k,3);setP(from+(to-from)*e);if(k<1)raf=requestAnimationFrame(step)})(t0);
}
handle.addEventListener('pointerdown',function(e){
  cancelAnimationFrame(raf);
  drag={y:e.clientY,p:P,moved:false};
  try{handle.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
handle.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dy=e.clientY-drag.y;
  if(Math.abs(dy)>5)drag.moved=true;
  setP(Math.max(0,Math.min(1,drag.p+dy/SH)));
});
function endDrag(){
  if(!drag)return;
  var d=drag;drag=null;
  if(!d.moved){animateTo(P>.5?0:1)}else{animateTo(P>.4?1:0)}
}
handle.addEventListener('pointerup',endDrag);
handle.addEventListener('pointercancel',endDrag);
handle.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();animateTo(P>.5?0:1)}});

/* ---------- Countdown ---------- */
var target=new Date(CONFIG.date.countdownTo).getTime();
function tick(){
  var d=Math.max(0,target-Date.now()),s=Math.floor(d/1000);
  $('#cd-d').textContent=Math.floor(s/86400);
  $('#cd-h').textContent=pad(Math.floor(s%86400/3600));
  $('#cd-m').textContent=pad(Math.floor(s%3600/60));
  $('#cd-s').textContent=pad(s%60);
}
tick();setInterval(tick,1000);

/* ---------- Icons ---------- */

  pts.forEach(function(p,i){s+='<circle cx="'+p[0]+'" cy="'+(p[1]+4)+'" r="7" fill="#fff1b8" opacity=".35"/><circle class="bulb" style="animation-delay:'+(i*.25)+'s" cx="'+p[0]+'" cy="'+(p[1]+4)+'" r="3.4" fill="#fff1b8" stroke="#d99a1b" stroke-width=".8"/>'});

}

}

  diya:'<svg class="ficon" viewBox="0 0 120 104" aria-hidden="true"><circle cx="60" cy="38" r="34" fill="#fff3c4" opacity=".6"/><path d="M60 6 C75 26 76 44 60 54 C44 44 45 26 60 6Z" fill="#ffb300"/><path d="M60 24 C68 36 68 44 60 50 C52 44 52 36 60 24Z" fill="#ff6d00"/><path d="M20 60 H100 C100 84 82 98 60 98 C38 98 20 84 20 60Z" fill="#c2703d" stroke="#8a4a22" stroke-width="2.5"/><path d="M27 65 H93" stroke="#e8a46a" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="79" r="2.8" fill="#4a2410"/><circle cx="70" cy="79" r="2.8" fill="#4a2410"/><path d="M53 87 Q60 93 67 87" fill="none" stroke="#4a2410" stroke-width="2.5" stroke-linecap="round"/><circle cx="43" cy="85" r="3.5" fill="#ff8fa3" opacity=".7"/><circle cx="77" cy="85" r="3.5" fill="#ff8fa3" opacity=".7"/></svg>',
  sun:sunIcon(),
  hand:'<svg class="ficon" viewBox="0 0 120 104" aria-hidden="true"><g stroke="#f4cdb3" stroke-linecap="round" fill="none"><path d="M46 58 L42 28" stroke-width="10"/><path d="M57 56 L57 16" stroke-width="10"/><path d="M68 58 L72 20" stroke-width="10"/><path d="M78 64 L88 36" stroke-width="9"/><path d="M40 76 L22 60" stroke-width="10"/></g><path d="M38 62 Q36 98 62 100 Q88 98 84 64 Q62 54 38 62Z" fill="#f4cdb3"/><g fill="#7a3b1d"><circle cx="42" cy="32" r="2.2"/><circle cx="57" cy="24" r="2.2"/><circle cx="72" cy="28" r="2.2"/><circle cx="87" cy="42" r="2.2"/><circle cx="26" cy="62" r="2.2"/><circle cx="57" cy="40" r="1.8"/><circle cx="57" cy="50" r="1.8"/></g><g fill="none" stroke="#7a3b1d" stroke-width="1.6" stroke-linecap="round"><circle cx="61" cy="82" r="6"/><circle cx="61" cy="82" r="2" fill="#7a3b1d"/><path d="M61 70 V74 M61 90 V94 M49 82 H53 M69 82 H73 M52 73 L55 76 M70 73 L67 76 M52 91 L55 88 M70 91 L67 88"/><path d="M44 68 Q61 60 78 68"/></g></svg>',
  mandap:'<svg class="ficon" viewBox="0 0 120 104" aria-hidden="true"><path d="M16 36 L60 12 L104 36Z" fill="#f2c14e" stroke="#c9972a" stroke-width="2"/><path d="M16 36 Q24 46 32 36 Q40 46 48 36 Q56 46 64 36 Q72 46 80 36 Q88 46 96 36 L104 36" fill="#ffe08a" stroke="#c9972a" stroke-width="1.5"/><circle cx="60" cy="9" r="3.5" fill="#ffe08a"/><g stroke="#f7e3a1" stroke-width="5" stroke-linecap="round"><path d="M24 42 V90"/><path d="M96 42 V90"/></g><g stroke="#f7e3a1" stroke-width="3" stroke-linecap="round" opacity=".85"><path d="M44 44 V90"/><path d="M76 44 V90"/></g><path d="M24 50 Q34 64 44 50 Q60 68 76 50 Q86 64 96 50" fill="none" stroke="#ff9eb5" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 6"/><rect x="14" y="90" width="92" height="8" rx="3" fill="#f7e3a1"/><path d="M60 88 C68 80 66 72 60 66 C54 72 52 80 60 88Z" fill="#ffb300"/><path d="M60 86 C64 80 63 76 60 73 C57 76 56 80 60 86Z" fill="#ff6d00"/></svg>',
  glasses:'<svg viewBox="0 0 120 92" aria-hidden="true"><g fill="rgba(246,227,161,.22)" stroke="#e8cf8c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(44 50) rotate(-16)"><path d="M-10 -30 H10 L8 -6 Q0 4 -8 -6Z"/><path d="M0 2 V24 M-9 26 H9"/></g><g transform="translate(76 50) rotate(16)"><path d="M-10 -30 H10 L8 -6 Q0 4 -8 -6Z"/><path d="M0 2 V24 M-9 26 H9"/></g></g><g fill="#f6e3a1"><circle cx="60" cy="14" r="2.6"/><circle cx="52" cy="6" r="1.8"/><circle cx="69" cy="7" r="1.8"/></g></svg>'

/* ---------- Festivities ---------- */
var track=$('#ftrack'),dotsEl=$('#fdots'),cards=[],dots=[];
CONFIG.fest.items.forEach(function(f,i){
  var a=document.createElement('article');a.className='fcard';
  a.style.setProperty('--c1',f.c1);a.style.setProperty('--c2',f.c2);
  a.innerHTML='<div class="ftop">'+lights()+(ICONS[f.icon]||'')+'</div><div class="fbot"><div class="fday">'+esc(f.day)+'</div>'+(f.time?'<div class="ftime">'+esc(f.time)+'</div>':'')+(f.note?'<div class="fnote">'+esc(f.note)+'</div>':'')+'<h3 class="fname">'+esc(f.name)+'</h3>'+(f.place?'<div class="fplace">'+esc(f.place)+'</div>':'')+'<div class="chip"><span class="sw" style="--sw:'+esc(f.color)+'"></span><span class="ct"><small>DRESS CODE</small><b>'+esc(f.dress)+'</b></span></div></div>';
  track.appendChild(a);
  cards.push(a);
  var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Show '+f.name);
  b.addEventListener('click',function(){track.scrollTo({left:a.offsetLeft-(track.clientWidth-a.offsetWidth)/2,behavior:reduce?'auto':'smooth'})});
  dotsEl.appendChild(b);dots.push(b);
});
var ticking=false;
function layoutCards(){
  ticking=false;
  var cr=track.getBoundingClientRect(),mid=cr.left+cr.width/2,best=0,bd=1e9;
  cards.forEach(function(c,i){
    var r=c.getBoundingClientRect(),dist=Math.abs(r.left+r.width/2-mid),d=Math.min(dist/(r.width+16),1);
    c.style.transform='scale('+(1-.16*d).toFixed(3)+')';
    c.style.opacity=(1-.5*d).toFixed(3);
    if(dist<bd){bd=dist;best=i}
  });
  dots.forEach(function(b,i){b.classList.toggle('on',i===best)});
}
function queueLayout(){if(!ticking){ticking=true;requestAnimationFrame(layoutCards)}}
track.addEventListener('scroll',queueLayout,{passive:true});
window.addEventListener('resize',queueLayout);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(queueLayout);
layoutCards();

/* ---------- Reception ---------- */
(function(){
  var r=CONFIG.reception;if(!r.enabled)return;
  $('#reception').hidden=false;
  var h='<p class="k">'+esc(r.kicker)+'</p><h2 class="gold-text">'+esc(r.title)+'</h2><div class="ic">'+ICONS.glasses+'</div>';
  if(r.day)h+='<p class="l1">'+esc(r.day)+'</p>';
  if(r.time||r.note)h+='<p class="l2">'+esc((r.time?r.time+' onwards':'')+(r.time&&r.note?' - ':'')+(r.note||''))+'</p>';
  if(r.place)h+='<p class="l3">'+esc(r.place)+'</p>';
  if(r.dress)h+='<div class="chip"><span class="ct"><small>DRESS CODE</small><b>'+esc(r.dress)+'</b></span></div>';
  $('#rcard').innerHTML=h;
})();

/* ---------- Copy address ---------- */
var toastT=0;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2000)}
function fallbackCopy(text){
  try{
    var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    var ok=document.execCommand('copy');document.body.removeChild(ta);return ok;
  }catch(e){return false}
}
$('#copy').addEventListener('click',function(){
  var text=CONFIG.venue.address;
  function done(ok){toast(ok?CONFIG.reach.copied:CONFIG.reach.copyFail)}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){done(true)},function(){done(fallbackCopy(text))});
  }else{done(fallbackCopy(text))}
});

/* ---------- Petal showers on arrival ---------- */
if('IntersectionObserver' in window){
  var seen={};
  var io2=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!seen[e.target.id]&&opened){seen[e.target.id]=1;shower(16)}})},{threshold:.4});
  io2.observe($('#rsvp'));
}
})();
</script>
